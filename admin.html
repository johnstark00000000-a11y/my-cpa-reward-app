<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CPA Admin Panel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background: #0f172a; color: #f8fafc; padding: 15px; min-height: 100vh; }
    .container { max-width: 600px; margin: 0 auto; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
    h2, h3 { color: #f59e0b; margin-bottom: 15px; }
    label { font-size: 13px; color: #94a3b8; display: block; margin-top: 10px; }
    input { width: 100%; padding: 12px; margin: 6px 0 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; }
    .btn { background: #f59e0b; color: #000; border: none; padding: 12px; border-radius: 8px; width: 100%; font-size: 16px; font-weight: bold; cursor: pointer; }
    .btn-red { background: #ef4444; color: #fff; }
    .btn-green { background: #10b981; color: #fff; }
    .hidden { display: none; }
    .req-item { background: #0f172a; padding: 10px; border-radius: 6px; margin-top: 8px; border: 1px solid #334155; }
  </style>
</head>
<body>

<div class="container">

  <!-- ADMIN LOGIN -->
  <div id="adminLoginCard" class="card">
    <h2>🔐 Admin Access Login</h2>
    <label>Admin Secret Password</label>
    <input type="password" id="adminPassInput" placeholder="Enter Password">
    <button class="btn" onclick="checkAdminPass()">Unlock Dashboard</button>
  </div>

  <!-- ADMIN DASHBOARD -->
  <div id="adminDashboard" class="hidden">
    
    <!-- User Balance Control -->
    <div class="card">
      <h3>👤 User Control</h3>
      <label>User UID</label>
      <input type="text" id="targetUserId" placeholder="Paste User UID">
      <label>Add/Cut Coins Amount</label>
      <input type="number" id="coinAmount" placeholder="e.g. 500 or -200">
      <button class="btn btn-green" onclick="updateUserCoins()">Update User Balance</button>
    </div>

    <!-- Task Publisher -->
    <div class="card">
      <h3>📋 Add CPA Task</h3>
      <label>Task Title</label>
      <input type="text" id="taskTitle" placeholder="e.g. Install App X">
      <label>Reward Coins</label>
      <input type="number" id="taskReward" placeholder="200">
      <label>CPA Offer Link</label>
      <input type="text" id="taskLink" placeholder="https://cpa-offer-link.com">
      <button class="btn" onclick="createNewTask()">Publish Task</button>
    </div>

    <!-- Withdraw Requests -->
    <div class="card">
      <h3>💸 Pending Withdrawal Requests</h3>
      <div id="withdrawList">
        <p style="color: #94a3b8; font-size: 14px;">रिक्वेस्ट लोड हो रही हैं...</p>
      </div>
    </div>

    <button class="btn btn-red" onclick="adminLogout()">Admin Logout</button>

  </div>

</div>

<script type="module">
  import { db, doc, getDoc, updateDoc, setDoc, collection, getDocs, increment } from './firebase-config.js';

  const ADMIN_SECRET = "admin1234"; 

  window.checkAdminPass = function() {
    if (document.getElementById('adminPassInput').value === ADMIN_SECRET) {
      document.getElementById('adminLoginCard').classList.add('hidden');
      document.getElementById('adminDashboard').classList.remove('hidden');
      loadWithdrawals();
    } else {
      alert("गलत पासवर्ड!");
    }
  };

  window.adminLogout = function() {
    document.getElementById('adminLoginCard').classList.remove('hidden');
    document.getElementById('adminDashboard').classList.add('hidden');
  };

  window.updateUserCoins = async function() {
    const uid = document.getElementById('targetUserId').value.trim();
    const amount = parseInt(document.getElementById('coinAmount').value);
    if (!uid || isNaN(amount)) return alert("UID और Amount भरें!");

    try {
      const userRef = doc(db, "users", uid);
      await updateDoc(userRef, { coins: increment(amount) });
      alert(`User (${uid}) का बैलेंस अपडेट हुआ!`);
      document.getElementById('coinAmount').value = "";
    } catch (e) { alert(e.message); }
  };

  window.createNewTask = async function() {
    const title = document.getElementById('taskTitle').value.trim();
    const reward = parseInt(document.getElementById('taskReward').value);
    const link = document.getElementById('taskLink').value.trim();

    if (!title || isNaN(reward) || !link) return alert("पूरी जानकारी दर्ज करें!");

    try {
      await setDoc(doc(db, "tasks", "task_" + Date.now()), {
        title: title, reward: reward, link: link, createdAt: new Date().toISOString()
      });
      alert("🎉 Task Live हो गया!");
      document.getElementById('taskTitle').value = "";
      document.getElementById('taskReward').value = "";
      document.getElementById('taskLink').value = "";
    } catch (e) { alert(e.message); }
  };

  async function loadWithdrawals() {
    const list = document.getElementById('withdrawList');
    try {
      const snap = await getDocs(collection(db, "withdrawals"));
      list.innerHTML = "";
      if(snap.empty) return list.innerHTML = "<p style='color: #94a3b8;'>कोई नई रिक्वेस्ट नहीं है।</p>";

      snap.forEach((d) => {
        const item = d.data();
        list.innerHTML += `
          <div class="req-item">
            <p><strong>UPI:</strong> ${item.upiId}</p>
            <p><strong>Coins:</strong> ${item.coins} | <strong>User:</strong> ${item.email}</p>
          </div>
        `;
      });
    } catch(e) { console.error(e); }
  }
</script>

</body>
</html>
